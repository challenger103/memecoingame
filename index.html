<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Degen Pit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: sticky top bar with a live trade tape, then one main column (max 1240px) whose views swap in place.
   The coin view splits chart | trade panel and stacks on phones. One committed look: a late-night casino floor. */
:root{
  color-scheme:dark;
  --bg:#140e22; --panel:#1d1531; --panel-2:#281d43; --line:#3a2d5c;
  --fg:#f1ecff; --muted:#a197c4; --faint:#6f6593;
  --brand:#ff4fa3; --brand-ink:#22051a;
  --up:#38e08c; --down:#ff5c6c; --gold:#ffc83d; --sky:#73b8ff;
  --up-bg:rgba(56,224,140,.12); --down-bg:rgba(255,92,108,.13); --gold-bg:rgba(255,200,61,.09); --brand-bg:rgba(255,79,163,.13);
  --f-display:"Bungee",Impact,"Arial Black",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.mono{font-family:var(--f-mono);font-size:12px}
.up{color:var(--up)} .down{color:var(--down)}
.fine{color:var(--muted);font-size:12.5px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px 20px;padding-block:10px}
.logo{font-family:var(--f-display);font-size:22px;line-height:1;background:none;border:0;padding:0;display:flex;gap:4px;color:var(--fg)}
.logo .l2{color:var(--brand)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;padding:7px 12px;border-radius:999px;color:var(--muted);font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tabs button:hover{color:var(--fg)}
.tabs button.on{background:var(--panel-2);color:var(--fg)}
.badge{background:var(--gold);color:#241800;font-size:11px;font-weight:800;border-radius:999px;padding:0 6px;line-height:17px}
.me{display:flex;align-items:center;gap:8px;min-width:0}
.solpx{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.me select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:130px}
.mebal{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 3px;font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.mebal .b2{color:var(--muted)}
@media (max-width:860px){
  .hdr{grid-template-columns:auto minmax(0,1fr)}
  .me{justify-self:end}
  .tabs{grid-column:1/-1;grid-row:2}
  .solpx,.mebal .b2{display:none}
}
.tape{border-top:1px solid var(--line);background:var(--panel)}
.tape .in{display:flex;gap:6px;overflow:hidden;padding-block:6px}
.chip{flex:none;border:0;border-radius:999px;padding:3px 10px;font-size:12px;white-space:nowrap;background:var(--panel-2);color:var(--muted)}
.chip.buy b{color:var(--up)} .chip.sell b{color:var(--down)}
.chip.big{background:var(--gold-bg);color:var(--fg)}
@media (prefers-reduced-motion:no-preference){.chip.fresh{animation:slide .45s ease-out}@keyframes slide{from{transform:translateX(-24px);opacity:0}}}

main.wrap{padding-block:20px 60px;display:flex;flex-direction:column;gap:16px}

/* common */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.panel.flush{padding:0;overflow:hidden}
.panel h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:10px}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-weight:700}
.btn:hover{border-color:var(--muted)}
.btn.brand{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.big{width:100%;padding:12px;font-size:15px}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:6px}
.btn.ghost{background:none}
.btn.danger{color:var(--down);border-color:var(--down)}
.buyb{background:var(--up);border-color:var(--up);color:#032312}
.sellb{background:var(--down);border-color:var(--down);color:#2a0308}
.lnk{background:none;border:0;padding:0;color:inherit;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-align:left}
.lnk:hover{color:var(--brand)}
.tk{font-family:var(--f-mono);font-weight:600;color:var(--sky)}
button.tk{background:none;border:0;padding:0}
button.tk:hover{text-decoration:underline}
.pill{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 5px;vertical-align:1px;background:var(--panel-2);color:var(--muted)}
.pill.ai{background:rgba(115,184,255,.16);color:var(--sky)}
.pill.you{background:var(--brand-bg);color:var(--brand)}
.pill.gold{background:var(--gold-bg);color:var(--gold)}
.pill.rug{background:var(--down-bg);color:var(--down)}
.pill.up{background:var(--up-bg);color:var(--up)}
.av{flex:none;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:13px;line-height:1;background:linear-gradient(135deg,hsl(var(--h) 70% 50%),hsl(calc(var(--h) + 50) 65% 28%))}
.av.l{width:42px;height:42px;font-size:22px}
.av.xl{width:76px;height:76px;font-size:40px}
.cimg{flex:none;display:grid;place-items:center;border-radius:8px;background:radial-gradient(circle at 30% 25%,hsl(var(--h) 85% 62%),hsl(calc(var(--h) + 40) 70% 22%));width:72px;height:72px;font-size:38px}
.cimg.l{width:96px;height:96px;font-size:54px;border-radius:12px}
.cimg.s{width:34px;height:34px;font-size:18px;border-radius:6px}
.pg{height:6px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--gold))}
.seg{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px;overflow-x:auto;max-width:100%}
.seg button{background:none;border:0;border-radius:6px;padding:6px 11px;color:var(--muted);font-weight:600;white-space:nowrap}
.seg button.on{background:var(--panel-2);color:var(--fg)}
input[type=text],input[type=number],input:not([type]),select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
input.sm{width:84px;padding:5px 8px}
textarea{resize:vertical}
.lbl{display:block;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin-bottom:6px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar .grow{flex:1 1 200px;min-width:0}
.pagehead h1{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,4vw,38px);line-height:1.05}
.pagehead .sub{color:var(--muted);max-width:68ch;margin-top:6px}
.empty{color:var(--muted);padding:24px;text-align:center}
.back{align-self:flex-start;background:none;border:0;color:var(--muted);padding:0;font-weight:600}
.back:hover{color:var(--fg)}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--f-mono);font-size:12px}
.tbl tr.mine td{background:var(--brand-bg)}

/* board */
.btop{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.btop{grid-template-columns:minmax(0,1fr)}}
.koth{position:relative;display:flex;gap:18px;align-items:center;padding:18px;border-radius:14px;cursor:pointer;
  background:radial-gradient(120% 140% at 0% 0%,rgba(255,200,61,.16),transparent 60%),var(--panel);border:1px solid rgba(255,200,61,.35)}
.koth .crown{font-family:var(--f-display);color:var(--gold);font-size:13px;letter-spacing:.04em}
.koth h2{font-size:22px;margin:4px 0}
.koth .mc{font-family:var(--f-display);font-size:30px;line-height:1}
.koth .cimg{width:110px;height:110px;font-size:62px;border-radius:14px}
.kb{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
@media (max-width:480px){.koth{flex-direction:column;align-items:flex-start}}
.ailog ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;max-height:212px;overflow:hidden}
.ailog li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;font-size:13px}
.ailog li .t{color:var(--faint);font-family:var(--f-mono);font-size:11px;padding-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{position:relative;display:flex;gap:12px;padding:12px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);cursor:pointer;overflow:hidden;min-width:0}
.card:hover{border-color:var(--muted)}
.card.hot{border-color:rgba(255,200,61,.6);background:linear-gradient(180deg,var(--gold-bg),transparent 70%),var(--panel)}
.card .cb{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.cn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm{display:flex;gap:10px;font-size:12.5px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.cdesc{font-size:12px;color:var(--faint);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.rugged{opacity:.62}
.card.rugged .cimg{filter:grayscale(1)}
.stamp{position:absolute;right:10px;top:12px;transform:rotate(8deg);font-family:var(--f-display);color:var(--down);border:2px solid var(--down);border-radius:6px;padding:1px 7px;font-size:14px;background:var(--bg)}
.flag{position:absolute;right:8px;top:8px;font-size:11px;font-weight:800;background:var(--gold);color:#241800;border-radius:5px;padding:1px 6px}
.flag.grad{background:var(--up);color:#032312}

/* coin */
.chead{display:flex;gap:16px;align-items:center}
.chead h1{font-size:clamp(22px,3.4vw,32px);font-weight:800;line-height:1.1}
.chi{min-width:0;display:flex;flex-direction:column;gap:6px}
.cmeta{color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:920px){.cgrid{grid-template-columns:minmax(0,1fr)}}
.cmain,.cside{display:flex;flex-direction:column;gap:16px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.st{background:var(--panel);padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.st > span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:700}
.st b{font-family:var(--f-mono);font-size:15px;font-weight:600}
.chartbox{padding:0;height:320px;position:relative}
@media (max-width:600px){.chartbox{height:250px}}
#chart{display:block;width:100%;height:100%}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border-radius:9px;padding:4px;margin-bottom:12px}
.seg2 button{border:0;background:none;padding:8px;border-radius:6px;font-weight:800;color:var(--muted)}
.seg2 button.on.buy{background:var(--up);color:#032312}
.seg2 button.on.sell{background:var(--down);color:#2a0308}
.amtrow{position:relative}
.amtrow input{font-family:var(--f-mono);font-size:18px;padding-right:52px}
.amtrow .unit{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700}
.quick{display:flex;gap:6px;margin:8px 0 12px;flex-wrap:wrap}
.quick button{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:5px 4px;font-size:12px;font-weight:600}
.est{font-size:13px;color:var(--muted);margin-bottom:12px;min-height:38px;font-variant-numeric:tabular-nums}
.est b{color:var(--fg)}
.pos{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-variant-numeric:tabular-nums}
.pos span:nth-child(even){text-align:right;font-family:var(--f-mono);font-size:12px}
.pos .full{grid-column:1/-1;color:var(--muted)}
.tradep .fine{margin-top:10px}
.holders{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:h}
.holders li{display:flex;align-items:center;gap:8px;font-size:13px;counter-increment:h}
.holders li::before{content:counter(h);color:var(--faint);font-family:var(--f-mono);font-size:11px;width:16px}
.holders li .pc{margin-left:auto;font-family:var(--f-mono);font-size:12px}
.shill{border-color:var(--brand)}
.shill .btn{margin-top:10px;width:100%}

/* twitter */
.twgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:920px){.twgrid{grid-template-columns:minmax(0,1fr)}.twside{order:-1}}
.twmain,.twside{display:flex;flex-direction:column;gap:16px;min-width:0}
.compose textarea{margin-bottom:10px}
.crow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tweet{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;padding:14px;border-bottom:1px solid var(--line)}
.tweet:last-child{border-bottom:0}
.tweet.big{background:linear-gradient(90deg,var(--gold-bg),transparent)}
.th{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.ver{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--sky);color:#04203d;font-size:10px;font-weight:900}
.ver.gold{background:var(--gold);color:#241800}
.tweet p{margin:4px 0 8px;font-size:15px;overflow-wrap:anywhere}
.tweet.big p{font-size:17px;font-weight:600}
.tf{display:flex;gap:18px;font-size:12px;font-family:var(--f-mono)}
.impact{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:12.5px;font-variant-numeric:tabular-nums}
.rollbig{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.rollbig b{font-family:var(--f-display);font-weight:400;font-size:36px;line-height:1}
.dice{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.die{width:30px;height:30px;display:grid;place-items:center;border-radius:7px;border:1px solid var(--line);font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.die.hit{background:var(--gold);color:#241800;border-color:var(--gold);font-weight:800}
.odds{height:10px;border-radius:99px;background:var(--panel-2);overflow:hidden;margin-top:4px}
.odds i{display:block;height:100%;background:var(--sky)}
.celebs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.celebs li{display:flex;gap:10px;align-items:center;font-size:13px}

/* leaderboard / following / wallets / profile */
.mine-strip{display:flex;gap:10px;flex-wrap:wrap}
.mine-strip .ms{background:var(--brand-bg);border:1px solid var(--brand);border-radius:8px;padding:6px 12px;font-size:13px}
.rank{font-family:var(--f-display);color:var(--faint);font-size:14px}
.rank.r1{color:var(--gold)} .rank.r2{color:#d8d3ea} .rank.r3{color:#e79a5a}
.fgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:920px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.ffeed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:520px;overflow-y:auto}
.ffeed li{font-size:13px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ffeed .t{color:var(--faint);font-family:var(--f-mono);font-size:11px;width:34px}
.sugg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.sg{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
.sg .grow{min-width:0;flex:1}
.sg .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.wcard{display:flex;flex-direction:column;gap:12px}
.wcard.act{border-color:var(--brand)}
.wtop{display:flex;gap:10px;align-items:center}
.wtop > div{min-width:0;flex:1}
.wstats{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px;font-variant-numeric:tabular-nums}
.wstats span:nth-child(odd){color:var(--muted)}
.wstats span:nth-child(even){text-align:right;font-family:var(--f-mono);font-size:12px}
.wbtns{display:flex;gap:6px;flex-wrap:wrap}
.wforms{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.wforms form,.wforms .panel{display:flex;flex-direction:column;gap:8px}
.phead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.phead .pi{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.phead h1{font-size:28px;font-weight:800;line-height:1.1;overflow-wrap:anywhere}
.pstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pacts{display:flex;gap:8px;flex-wrap:wrap}

/* launch */
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.lgrid{grid-template-columns:minmax(0,1fr)}}
.lform{display:flex;flex-direction:column;gap:6px}
.lform .lbl{margin-top:8px}
.lform .btn{margin-top:14px}
.emo{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:4px}
.emo label{cursor:pointer}
.emo input{position:absolute;opacity:0;pointer-events:none}
.emo span{display:grid;place-items:center;width:38px;height:38px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-size:20px}
.emo input:checked+span{border-color:var(--brand);background:var(--brand-bg)}
.emo input:focus-visible+span{outline:2px solid var(--brand)}
.lprev{display:flex;flex-direction:column;gap:12px;min-width:0}
.tips ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}

/* hack */
.badge.live{background:var(--down);color:#2a0308}
.term{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px;font-family:var(--f-mono);display:flex;flex-direction:column;gap:12px;min-width:0}
.term.t10{border-color:var(--gold)} .term.t3{border-color:var(--down);box-shadow:0 0 0 1px var(--down-bg)}

.hkrow .no{width:22px;color:var(--faint);font-size:11px;flex:none}

.cell.hit{background:var(--up);color:#032312;border-color:var(--up)}
.cell.near{background:var(--gold);color:#241800;border-color:var(--gold)}
.cell.miss{color:var(--faint)}
.cell.blank{opacity:.35}

.cnt b.e{color:var(--up)} .cnt b.n{color:var(--gold)}

.hkres.bad{border-color:var(--down);background:linear-gradient(90deg,var(--down-bg),transparent),var(--panel)}
.hkres h2{font-size:20px}
.pill.t10{background:var(--gold-bg);color:var(--gold)}
.pill.t3{background:var(--down-bg);color:var(--down)}
.btn:disabled{opacity:.4;cursor:not-allowed}

.toasts{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;flex-direction:column;gap:8px;width:min(360px,calc(100vw - 32px))}
.toast{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.toast.up{border-color:var(--up)} .toast.down{border-color:var(--down)} .toast.gold{border-color:var(--gold);background:linear-gradient(90deg,var(--gold-bg),transparent),var(--panel-2)}

.modal h2{font-size:20px;margin-bottom:6px}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}

const poisson = l => { const L = Math.exp(-l); let k = 0, p = 1; do { k++; p *= R(); } while (p > L); return k - 1; };

/* ---------- state ---------- */
let S = null;
let BOTS = [], DEVS = [];
const UI = { view: "board", id: null, sort: "trend", q: "", side: "buy", ptab: "hold", lbSort: "pnl", prev: null };
let lastFollowToast = -99;

function derive() {
  BOTS = Object.values(S.wallets).filter(w => !w.isPlayer && !w.ai);
  DEVS = Object.values(S.wallets).filter(w => w.ai);
}
const W = () => S.wallets[S.active];
const price = c => c.vSol / c.vTok;
const mcSol = c => price(c) * SUPPLY;
const nw = w => { let v = w.sol; for (const id in w.hold) { const c = S.coins[id]; if (c) v += w.hold[id].tok * price(c); } return v; };
const quoteBuy = (c, a) => { const ns = c.vSol + a * (1 - FEE); return c.vTok - c.vSol * c.vTok / ns; };
const quoteSell = (c, t) => { const nt = c.vTok + t; return (c.vSol - c.vSol * c.vTok / nt) * (1 - FEE); };
const chg = c => { const k = c.candles; if (!k.length) return 0; return price(c) / k[Math.max(0, k.length - 61)].o - 1; };
const prog = c => clamp(c.real / GRAD * 100, 0, 100);
const ago = t => { const s = Math.max(0, S.t - t); return s < 60 ? s + "s" : s < 3600 ? Math.floor(s / 60) + "m" : Math.floor(s / 3600) + "h"; };
const isMine = id => S.pw.includes(id);

  const w = Object.assign({ id: "w" + (S.seq++), addr: mkAddr(), name: "anon", emoji: "🐸", hue: ri(0, 359), bio: "", isPlayer: false, ai: false, style: "degen", sol: 0, dep: 0, hold: {}, realized: 0, trades: [], made: [], rugs: 0, vol: 0, n: 0, wins: 0, losses: 0, joined: S.t }, o);

function uniqTicker(t) { const taken = new Set(Object.values(S.coins).map(c => c.ticker)); let x = t, i = 2; while (taken.has(x)) x = t + (i++); return x; }

/* ---------- trading ---------- */
function candle(c, p, v) {
  const b = Math.floor(S.t / 5); let k = c.candles[c.candles.length - 1];
  if (!k || k.b !== b) { const o = k ? k.c : p; k = { b, o, h: Math.max(o, p), l: Math.min(o, p), c: p, v: 0 }; c.candles.push(k); if (c.candles.length > 110) c.candles.shift(); }
  else { k.h = Math.max(k.h, p); k.l = Math.min(k.l, p); k.c = p; }
  k.v += v;
}
function trade(w, c, side, amt, o = {}) {
  if (side === "buy") {
    amt = Math.min(amt, w.sol); if (!(amt > 1e-6)) return null;
    const net = amt * (1 - FEE), k = c.vSol * c.vTok, ns = c.vSol + net, nt = k / ns, tok = c.vTok - nt;
    c.vSol = ns; c.vTok = nt; c.real += net; w.sol -= amt;

    return record(w, c, "buy", amt, tok, o, 0);
  }
  const h = w.hold[c.id]; if (!h || h.tok <= 0) return null;
  amt = Math.min(amt, h.tok); if (!(amt > 0)) return null;
  const k = c.vSol * c.vTok, nt = c.vTok + amt, ns = k / nt, gross = c.vSol - ns, sol = gross * (1 - FEE);
  c.vSol = ns; c.vTok = nt; c.real = Math.max(0, c.real - gross); w.sol += sol;
  const cb = h.cost * (amt / h.tok); h.tok -= amt; h.cost -= cb;
  const pnl = sol - cb; w.realized += pnl; if (pnl > 0) w.wins++; else w.losses++;
  if (h.tok < 1) { delete w.hold[c.id]; delete c.holders[w.id]; } else c.holders[w.id] = h.tok;
  return record(w, c, "sell", sol, amt, o, pnl);
}
function record(w, c, side, sol, tok, o, pnl) {
  const tr = { t: S.t, w: w.id, c: c.id, tk: c.ticker, side, sol, tok, mc: mcSol(c), pnl };
  c.trades.unshift(tr); if (c.trades.length > 45) c.trades.length = 45;
  w.trades.unshift(tr); if (w.trades.length > 40) w.trades.length = 40;
  w.vol += sol; w.n++;
  S.feed.unshift(tr); if (S.feed.length > 40) S.feed.length = 40;
  candle(c, price(c), sol);
  if (tr.mc > c.ath) c.ath = tr.mc;
  if (!c.grad && c.real >= GRAD) { c.grad = true; aiLog(`🎓 ${tkLink(c)} completed its bonding curve`); }
  const f = S.follow[w.id];
  if (f && !o.copy) {
    S.ffeed.unshift(tr); if (S.ffeed.length > 60) S.ffeed.length = 60;
    if (!S.booting && !w.isPlayer) {
      const me = W();
      if (f.copy > 0 && side === "buy" && sol >= 0.05 && me.sol > 0.001) {
        const t2 = trade(me, c, "buy", Math.min(f.copy, me.sol), { copy: true });
        if (t2) toast(`📋 Copied <b>${esc(w.name)}</b>: bought ${fSol(t2.sol)} SOL of <b>$${esc(c.ticker)}</b>`, "up", { a: "coin", v: c.id, label: "View" });
      } else if (f.copy > 0 && side === "sell" && !w.hold[c.id] && me.hold[c.id]) {
        const t2 = trade(me, c, "sell", me.hold[c.id].tok, { copy: true });
        if (t2) toast(`📋 ${esc(w.name)} exited <b>$${esc(c.ticker)}</b>. You sold too: ${t2.pnl >= 0 ? "+" : ""}${fSol(t2.pnl)} SOL`, t2.pnl >= 0 ? "up" : "down");
      } else if (f.alert && S.t - lastFollowToast >= 4 && sol >= 0.1) {
        lastFollowToast = S.t;
        toast(`👀 <b>${esc(w.name)}</b> ${side === "buy" ? "bought" : "sold"} ${fSol(sol)} SOL of <b>$${esc(c.ticker)}</b>`, "", { a: "coin", v: c.id, label: "View" });
      }
    }
  }
  return tr;
}

function botTrade(c, isBuy) {
  if (isBuy) {
    const w = pick(BOTS); if (w.sol < 0.02) return;
    let a;
    switch (w.style) {
      case "whale": a = rnd(1, 10); break;
      case "sniper": a = rnd(0.2, 2.5); break;
      case "jeet": a = rnd(0.05, 1); break;
      case "diamond": a = rnd(0.1, 2); break;
      default: a = R() * R() * 2.5 + 0.02;
    }
    if (c.boost) a *= rnd(1.5, 4);
    if (c.running || c.grad) a *= clamp(Math.sqrt(mcSol(c) / 80), 1, 5);
    a = Math.min(a, w.sol * 0.4); if (a < 0.01) return;
    trade(w, c, "buy", a);
  } else {
    const ids = Object.keys(c.holders).filter(id => id !== c.dev && !S.wallets[id].isPlayer);
    if (!ids.length) return;
    const w = S.wallets[pick(ids)];
    if (w.style === "diamond" && R() < 0.75) return;
    const h = w.hold[c.id]; if (!h) return;
    trade(w, c, "sell", h.tok * (w.style === "jeet" ? 1 : c.running ? rnd(0.1, 0.45) : rnd(0.25, 1)));
  }
}

function tickCoin(c) {
  if (c.dead && !(c.runner && !c.topped && S.t >= c.runAt)) { if (R() < 0.01) botTrade(c, R() < 0.35); return; }
  for (const s of c.snipers) {
    if (s.done) continue;
    const w = S.wallets[s.w]; if (!w) { s.done = true; continue; }
    if (!s.sellAt) { if (S.t >= s.buyAt) { trade(w, c, "buy", Math.min(s.amt, w.sol * 0.5)); s.sellAt = S.t + (c.player ? ri(6, 22) : ri(15, 90)); s.entry = price(c); } }
    else if (S.t >= s.sellAt || price(c) > s.entry * rnd(1.8, 3.5) || c.rugged) { const h = w.hold[c.id]; if (h) trade(w, c, "sell", h.tok); s.done = true; }
  }
  c.hype *= c.player ? 0.965 : c.rugged ? 0.9 : 0.986;
  if (!c.rugged && R() < (c.player ? 0.0008 : 0.003)) { c.hype += rnd(0.8, 2.2); aiLog(`📈 ${tkLink(c)} is catching a bid out of nowhere`); }
  c.running = !!c.runner && !c.rugged && !c.topped && S.t >= c.runAt;
  if (c.running) {
    if (c.hype < 0.9) c.hype = 0.9;
    if (S.t >= c.nextWave) { c.hype += rnd(0.8, 2); c.nextWave = S.t + ri(30, 90); }
    if (!c.calledRun && mcSol(c) > 120) { c.calledRun = true; aiLog(`🏃 ${tkLink(c)} is running. Higher lows all the way up`); }
    if (mcSol(c) >= c.runTarget) { c.topped = true; c.running = false; c.exitP += ri(10, 25); aiLog(`🏔️ ${tkLink(c)} topped out near ${fUsd(mcSol(c) * S.solUsd)}`); }
  }
  if (c.grad && !c.rugged && c.hype < 0.3) c.hype = 0.3;
  if (c.boost > 0) { c.boost--; if (c.boost === 0) c.exitP += ri(15, 30); }
  if (c.exitP > 0) c.exitP--;
  c.ph.push(price(c)); if (c.ph.length > 12) c.ph.shift();
  const mom = c.ph[c.ph.length - 1] / c.ph[0] - 1;
  const lam = Math.min(14, 0.15 + c.hype * 3.2 + (c.boost ? 4 : 0) + (c.exitP ? 1.5 : 0));
  let buyP = 0.42 + 0.2 * Math.tanh(c.hype - 0.6) + clamp(mom * 0.25, -0.15, 0.12) + (c.boost ? 0.4 : 0) - (c.exitP ? 0.32 : 0) - (c.player && !c.running ? 0.1 : 0) - (c.rugged ? 0.3 : 0) + (c.running ? 0.16 : 0) + (c.grad && !c.running ? 0.08 : 0);
  buyP = clamp(buyP, 0.04, 0.95);
  const n = poisson(lam);
  for (let i = 0; i < n; i++) botTrade(c, R() < buyP);
  if (c.rugger && !c.rugged && (S.t >= c.rugAt || mcSol(c) >= c.rugMc)) rug(c);
  if (!c.running && !c.grad && S.t - c.born > 150 && c.hype < 0.04 && !c.boost) c.dead = true;
}

function rug(c) {
  const d = S.wallets[c.dev]; const h = d.hold[c.id]; let got = 0;
  if (h) { const tr = trade(d, c, "sell", h.tok, { rug: true }); got = tr ? tr.sol : 0; }
  c.rugged = true; c.hype = 0; c.boost = 0; c.exitP = 25; d.rugs++;
  for (const id of Object.keys(c.holders)) { const w = S.wallets[id]; if (!w.isPlayer && R() < 0.6) trade(w, c, "sell", w.hold[c.id].tok); }
  aiLog(`💀 <b>${esc(d.name)}</b> rugged ${tkLink(c)} and walked off with ${fSol(got)} SOL`);
  postTweet(pick(BOTS).id, pick(RUGL).replace("{s}", fSol(got)).replaceAll("$T", "$" + c.ticker), c.id);
  for (const pid of S.pw) {
    const w = S.wallets[pid], ph = w.hold[c.id];
    if (ph) toast(`💀 <b>$${esc(c.ticker)}</b> got rugged. Your bag in ${esc(w.name)} is worth ${fSol(quoteSell(c, ph.tok))} SOL now`, "down", { a: "coin", v: c.id, label: "View" });
  }
}

/* ---------- sim loop ---------- */
function sim() {
  S.t++;
  S.solUsd = clamp(S.solUsd * (1 + rnd(-0.0015, 0.0015)), 120, 320);
  let active = 0; for (const id of S.order) { const c = S.coins[id]; if (!c.dead && !c.rugged) active++; }
  if (active < 34 && R() < (S.booting ? 0.2 : 0.12)) aiLaunch();
  for (const id of S.order.slice()) if (S.coins[id]) tickCoin(S.coins[id]);
  const b = pick(BOTS); if (b.sol < 0.5 && R() < 0.3) { const x = b.style === "whale" ? rnd(80, 300) : rnd(2, 25); b.sol += x; b.dep += x; }
  for (const d of DEVS) if (d.sol < 10) { d.sol += 50; d.dep += 50; }
  if (R() < 0.1) fillerTweet();
  for (const tw of S.tweets.slice(0, 15)) { tw.likes += Math.floor(R() * (tw.big ? 400 : 3)); tw.rts += Math.floor(R() * (tw.big ? 80 : 1.3)); }
  if (S.t >= S.nextRoll) {
    S.nextRoll = S.t + 60;
    const roll = S.forceRoll ? 1 : ri(1, 20); S.forceRoll = false;
    S.rolls.unshift({ t: S.t, roll }); if (S.rolls.length > 12) S.rolls.length = 12;
    if (roll === 1) celebTweet();
  }
  if (S.hack && S.t >= S.hack.ends) hackEnd(false, "Time ran out");
  if (S.t % 10 === 0) prune();
}
function prune() {
  if (S.order.length <= 90) return;
  const keep = new Set();
  S.pw.forEach(id => { const w = S.wallets[id]; Object.keys(w.hold).forEach(k => keep.add(k)); w.made.forEach(k => keep.add(k)); });
  if (UI.view === "coin") keep.add(UI.id);
  for (let i = S.order.length - 1; i >= 0 && S.order.length > 90; i--) {
    const c = S.coins[S.order[i]];
    if ((c.dead || c.rugged) && !keep.has(c.id)) {
      for (const wid in c.holders) delete S.wallets[wid].hold[c.id];
      delete S.coins[c.id]; S.order.splice(i, 1);
    }
  }
}

/* ---------- hacking ---------- */
function profitRank(id) { const rows = Object.values(S.wallets).map(w => [w.id, nw(w) - w.dep]).sort((a, b) => b[1] - a[1]); return rows.findIndex(r => r[0] === id) + 1; }
function hackTier(rank) {
  if (rank <= 3) return { name: "Top 3 vault", cls: "t3", len: 6, alpha: HEX, mode: "count", max: 10, time: 120, fee: 1, pct: [0.2, 0.4], cap: 150, trace: 0.6, tracePct: 0.15 };
  if (rank <= 10) return { name: "Top 10 cold wallet", cls: "t10", len: 5, alpha: HEX, mode: "count", max: 10, time: 120, fee: 0.5, pct: [0.15, 0.3], cap: 80, trace: 0.5, tracePct: 0.1 };
  return { name: "Hot wallet", cls: "t0", len: 5, alpha: DEC, mode: "pos", max: 6, time: 60, fee: 0.1, pct: [0.08, 0.2], cap: 20, trace: 0.2, tracePct: 0.05 };
}
function score(code, g) {
  const n = code.length, pos = [], left = {}; let exact = 0, near = 0;
  for (let i = 0; i < n; i++) { if (g[i] === code[i]) { exact++; pos[i] = "hit"; } else left[code[i]] = (left[code[i]] || 0) + 1; }
  for (let i = 0; i < n; i++) { if (pos[i]) continue; if (left[g[i]] > 0) { left[g[i]]--; near++; pos[i] = "near"; } else pos[i] = "miss"; }
  return { exact, near, pos };
}
function hackStart(id) {
  const t = S.wallets[id], me = W();
  if (!t || t.isPlayer) return toast("You can't hack your own wallets.", "down");
  if (S.hack) { go("hack"); return toast("Finish the hack you're running first.", "down"); }
  const cd = (S.hardened[id] || 0) - S.t; if (cd > 0) return toast(`${esc(t.name)} patched their security. Try again in ${mmss(cd)}.`, "down");
  const gcd = 20 - (S.t - S.lastHack); if (gcd > 0) return toast(`Your exploit kit is cooling down. ${gcd}s left.`, "down");
  const rank = profitRank(id), tier = hackTier(rank);
  if (me.sol < tier.fee) return toast(`This exploit costs ${tier.fee} SOL and ${esc(me.name)} has ${fSol(me.sol)}.`, "down");
  me.sol -= tier.fee;
  S.hackRes = null;
  S.hack = { target: id, from: me.id, rank, tier, code: Array.from({ length: tier.len }, () => pick([...tier.alpha])).join(""), guesses: [], ends: S.t + tier.time };
  S.lastHack = S.t;
  go("hack");
  setTimeout(() => $("#hkin")?.focus(), 0);
}
function hackGuess() {
  const h = S.hack, el = $("#hkin"); if (!h || !el) return;
  const g = el.value.toUpperCase();
  if (g.length !== h.tier.len || [...g].some(ch => !h.tier.alpha.includes(ch))) return toast(`Enter exactly ${h.tier.len} characters using ${h.tier.alpha === HEX ? "0–9 and A–F" : "0–9"}.`, "down");
  h.guesses.push({ g, ...score(h.code, g) });
  el.value = "";
  if (h.guesses[h.guesses.length - 1].exact === h.tier.len) return hackEnd(true);
  if (h.guesses.length >= h.tier.max) return hackEnd(false, "Out of attempts");
  upHack(); el.focus();
}
function hackEnd(ok, why) {
  const h = S.hack; if (!h) return;
  const t = S.wallets[h.target], me = S.wallets[h.from] || W();
  let res;
  if (ok) {
    const loot = Math.min(h.tier.cap, t.sol * rnd(h.tier.pct[0], h.tier.pct[1]));
    t.sol -= loot; t.hacked = (t.hacked || 0) + 1;
    me.sol += loot; me.hkOk = (me.hkOk || 0) + 1; me.hkLoot = (me.hkLoot || 0) + loot;
    S.hardened[t.id] = S.t + 600;
    postTweet(t.id, pick(HACKED_LINES).replace("{p}", me.name).replace("{s}", fSol(loot)), null);
    aiLog(`🔓 <b>${esc(me.name)}</b> cracked <b>${esc(t.name)}</b> and drained ${fSol(loot)} SOL`);
    toast(`🔓 Cracked <b>${esc(t.name)}</b>. Drained ${fSol(loot)} SOL into ${esc(me.name)}.`, "gold");
    res = { ok: true, loot };
  } else {
    me.hkFail = (me.hkFail || 0) + 1;
    S.hardened[t.id] = S.t + 300;
    let lost = 0;
    if (R() < h.tier.trace) { lost = me.sol * h.tier.tracePct; me.sol -= lost; t.sol += lost; me.hkLost = (me.hkLost || 0) + lost; }
    toast(lost ? `🚨 ${why}. <b>${esc(t.name)}</b> traced you and took ${fSol(lost)} SOL back.` : `${why}. The hack on ${esc(t.name)} failed.`, "down");
    res = { ok: false, why, lost };
  }
  S.hackRes = Object.assign({ code: h.code, target: t.id, from: me.id, tier: h.tier, tries: h.guesses.length, fee: h.tier.fee }, res);
  S.hack = null;
  if (UI.view === "hack") render(); else update();
}

function boardList() {

  switch (UI.sort) {
    case "trend": return cs.filter(c => !c.dead && !c.rugged).sort((a, b) => (b.hype + (b.boost ? 5 : 0)) - (a.hype + (a.boost ? 5 : 0)));

    case "grad": return cs.filter(c => c.grad && !c.rugged).sort((a, b) => mcSol(b) - mcSol(a));

    case "mine": return cs.filter(c => isMine(c.dev) || S.pw.some(id => S.wallets[id].hold[c.id]));

function upEst() {
  const c = S.coins[UI.id], el = $("#amt"); if (!c || !el) return;

    setH("est", `You get ≈ <b>${fTok(tok)} $${esc(c.ticker)}</b><br>Price impact <b class="${imp > 0.1 ? "down" : ""}">${fPct(imp)}</b> · balance ${fSol(me.sol)} SOL`);
  } else {
    const h = me.hold[c.id];
    if (!h) return setH("est", `${esc(me.name)} holds none of this coin.`);
    const tok = h.tok * clamp(v, 0, 100) / 100;
    setH("est", `Sell ${fTok(tok)} → ≈ <b>${fSol(quoteSell(c, tok))} SOL</b>`);
  }
}
function upPos(c) {
  const me = W(), h = me.hold[c.id];
  if (!h) return setH("pos", `<span class="full">${esc(me.name)} has no position here.</span>`);
  const val = quoteSell(c, h.tok), pnl = val - h.cost;
  setH("pos", `<span>Your bag</span><span>${fTok(h.tok)}</span><span>Exit value</span><span>${fSol(val)} SOL</span><span>Cost</span><span>${fSol(h.cost)} SOL</span><span>Unrealized</span><span class="${pnl >= 0 ? "up" : "down"}">${pnl >= 0 ? "+" : ""}${fSol(pnl)} SOL (${fPct(h.cost ? pnl / h.cost : 0)})</span>`);
}
function drawChart(c) {
  const cv = $("#chart"); if (!cv) return;
  const box = cv.parentElement, Wd = box.clientWidth, Ht = box.clientHeight, dpr = window.devicePixelRatio || 1;
  if (!Wd || !Ht) return;
  if (cv.width !== Math.round(Wd * dpr) || cv.height !== Math.round(Ht * dpr)) { cv.width = Math.round(Wd * dpr); cv.height = Math.round(Ht * dpr); }
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, Wd, Ht);
  const css = getComputedStyle(document.documentElement), col = n => css.getPropertyValue(n).trim();
  const up = col("--up"), dn = col("--down"), line = col("--line"), faint = col("--faint"), muted = col("--muted");
  const rightW = 64, plotW = Wd - rightW - 10, top = 14, plotH = Ht - top - 22;
  const N = Math.max(20, Math.floor(plotW / 9)), ks = c.candles.slice(-N);
  let lo = Infinity, hi = -Infinity; ks.forEach(k => { lo = Math.min(lo, k.l); hi = Math.max(hi, k.h); });
  if (hi - lo < hi * 0.02) { hi *= 1.03; lo *= 0.97; }
  const pad = (hi - lo) * 0.08; hi += pad; lo = Math.max(0, lo - pad);
  const y = v => top + (hi - v) / (hi - lo) * plotH;
  g.font = `11px ${col("--f-mono")}`; g.textBaseline = "middle"; g.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * i / 4, yy = Math.round(y(v)) + 0.5;
    g.strokeStyle = line; g.beginPath(); g.moveTo(8, yy); g.lineTo(8 + plotW, yy); g.stroke();
    g.fillStyle = faint; g.fillText(fUsd(v * SUPPLY * S.solUsd), plotW + 16, yy);
  }
  const cw = plotW / N;
  ks.forEach((k, i) => {
    const x = 8 + i * cw + cw / 2, isUp = k.c >= k.o;
    g.strokeStyle = g.fillStyle = isUp ? up : dn;
    g.beginPath(); g.moveTo(Math.round(x) + 0.5, y(k.h)); g.lineTo(Math.round(x) + 0.5, y(k.l)); g.stroke();
    const y1 = y(Math.max(k.o, k.c)), y2 = y(Math.min(k.o, k.c));
    g.fillRect(x - cw * 0.33, y1, cw * 0.66, Math.max(1.5, y2 - y1));
  });
  const last = price(c), ly = Math.round(y(last)) + 0.5, lc = chg(c) >= 0 ? up : dn;
  g.setLineDash([3, 3]); g.strokeStyle = lc; g.beginPath(); g.moveTo(8, ly); g.lineTo(8 + plotW, ly); g.stroke(); g.setLineDash([]);
  g.fillStyle = lc; g.fillRect(plotW + 10, ly - 9, rightW - 2, 18);
  g.fillStyle = col("--bg"); g.fillText(fUsd(mcSol(c) * S.solUsd), plotW + 16, ly);
  g.fillStyle = muted; g.textBaseline = "alphabetic"; g.fillText("Market cap · 5s candles", 10, Ht - 6);
  if (c.rugged) {
    g.save(); g.translate(8 + plotW / 2, top + plotH / 2); g.rotate(-0.12);
    g.font = `${Math.min(64, plotW / 6)}px ${col("--f-display")}`; g.textAlign = "center"; g.textBaseline = "middle";
    g.globalAlpha = 0.22; g.fillStyle = dn; g.fillText("RUGGED", 0, 0); g.restore();
  }
}

  side: v => { UI.side = v; render(); },
  q: v => { const el = $("#amt"); if (el) { el.value = v; upEst(); } },
  exec: () => { const c = S.coins[UI.id]; const v = parseFloat($("#amt").value); if (UI.side === "buy") doBuy(c, v); else doSell(c, v); },
  shill: v => { const c = S.coins[v]; const me = S.wallets[c.dev]; postTweet(me.id, pick(SHILLS).replaceAll("$T", "$" + c.ticker), c.id, { likes: ri(0, 6) }); shillEffect(c); update(); },
  tweet: () => {
    const ta = $("#twtext"), txt = ta.value.trim();
    if (!txt) return toast("Write something first.", "down");
    if (S.t - S.lastTweet < 8) return toast(`Slow down. You can post again in ${8 - (S.t - S.lastTweet)}s.`, "down");
    S.lastTweet = S.t;
    const me = W(), tks = [...txt.matchAll(/\$([A-Za-z0-9]{2,14})/g)].map(m => m[1].toUpperCase());
    const c = S.order.map(id => S.coins[id]).find(c => tks.includes(c.ticker));
    postTweet(me.id, txt, c?.id, { likes: ri(0, 6), rts: ri(0, 1) });
    ta.value = "";
    if (c && isMine(c.dev) && !c.rugged) shillEffect(c);
    else { if (c) c.hype += 0.02; toast("Posted.", "up"); }
    update();
  },
  lbsort: v => { UI.lbSort = v; render(); },
  hack: v => hackStart(v),
  hkguess: () => hackGuess(),
  hkkey: v => { const el = $("#hkin"); if (!el || !S.hack) return; el.value = v === "del" ? el.value.slice(0, -1) : (el.value + v).slice(0, S.hack.tier.len); },
  hkquit: () => hackEnd(false, "You aborted"),
  hkdone: () => { S.hackRes = null; render(); },
  follow: v => {
    const w = S.wallets[v];
    if (S.follow[v]) { delete S.follow[v]; toast(`Unfollowed ${esc(w.name)}.`); }
    else { S.follow[v] = { copy: 0, alert: true }; toast(`Following <b>${esc(w.name)}</b>. Their trades show up in Following.`, "up"); }
    if (UI.view === "following") render(); else update();
  },
  use: v => { S.active = v; toast(`Now trading as <b>${esc(S.wallets[v].name)}</b>.`); render(); },
  edit: v => editModal(v),
  saveprof: v => {
    const w = S.wallets[v], n = $("#pename").value.trim();
    if (n.length < 2) return toast("Names need at least 2 characters.", "down");
    w.name = n; w.emoji = document.querySelector('input[name="peemo"]:checked')?.value || w.emoji; w.bio = $("#pebio").value.trim();
    closeModal(); toast("Profile saved.", "up"); render();
  },
  close: () => closeModal(),
  ptab: v => { UI.ptab = v; update(); },
  copyaddr: v => { const a = S.wallets[v].addr; try { navigator.clipboard.writeText(a).then(() => toast("Address copied."), () => toast(a)); } catch (e) { toast(a); } },
  air: () => {
    const cd = 180 - (S.t - S.lastAir);
    if (cd > 0) return toast(`The faucet is dry. Try again in ${mmss(cd)}.`, "down");
    const me = W(); me.sol += 2; me.dep += 2; S.lastAir = S.t; toast(`Dripped 2 SOL into ${esc(me.name)}.`, "up"); update();
  },
  reset: () => modal(`<h2>Reset the game?</h2><p class="muted">Every wallet, coin, follow and tweet in this browser goes away, and you start over with 10 SOL.</p><div class="mrow"><button class="btn ghost" data-a="close">Keep playing</button><button class="btn danger" data-a="doreset">Reset</button></div>`),
  doreset: () => { closeModal(); try { localStorage.removeItem(KEY); } catch (e) {} newGame(); UI.view = "board"; render(); toast("Fresh start. 10 SOL. Don't blow it.", "up"); }
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  if (el.tagName === "A") e.preventDefault();
  const fn = ACT[el.dataset.a]; if (fn) { e.stopPropagation(); fn(el.dataset.v, el); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#modal").hidden) closeModal();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("article[data-a], div[data-a][tabindex]")) { e.preventDefault(); e.target.click(); }
  if (e.key === "Enter" && e.target.id === "amt") ACT.exec();
  if (e.key === "Enter" && e.target.id === "hkin") hackGuess();
});
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "amt") upEst();
  else if (t.id === "hkin" && S.hack) { const a = S.hack.tier.alpha; t.value = [...t.value.toUpperCase()].filter(ch => a.includes(ch)).join("").slice(0, S.hack.tier.len); }
  else if (t.id === "q") { UI.q = t.value; upBoard(); }
  else if (t.closest("#flaunch")) upLaunch();
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "wsel") { ACT.use(t.value); }
  else if (t.dataset.copy) { const f = S.follow[t.dataset.copy]; if (f) { f.copy = Math.max(0, parseFloat(t.value) || 0); toast(f.copy ? `Copy trading ${fSol(f.copy)} SOL per buy.` : "Copy trading off."); } }
  else if (t.dataset.alert) { const f = S.follow[t.dataset.alert]; if (f) f.alert = t.checked; }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === "flaunch") submitLaunch();
  else if (id === "fnew") {
    const n = ($("#nwname").value.trim() || `burner_${S.pw.length + 1}`).slice(0, 20);
    const w = mkWallet({ name: n, emoji: pick(EMOJIS), isPlayer: true, style: "human", sol: 0, dep: 0, bio: "" });
    S.pw.push(w.id); toast(`Created <b>${esc(n)}</b>. Send it some SOL to start trading.`, "up"); render();
  } else if (id === "ftx") {
    const from = S.wallets[$("#txfrom").value], to = S.wallets[$("#txto").value], a = parseFloat($("#txamt").value);
    if (from === to) return toast("Pick two different wallets.", "down");
    if (!(a > 0)) return toast("Enter an amount above 0.", "down");
    if (a > from.sol + 1e-9) return toast(`${esc(from.name)} only has ${fSol(from.sol)} SOL.`, "down");
    from.sol -= a; from.dep -= a; to.sol += a; to.dep += a;
    toast(`Sent ${fSol(a)} SOL from ${esc(from.name)} to ${esc(to.name)}.`, "up"); render();
  }
});

// Don't swap DOM under a pressed pointer, or the click lands on a node that no longer exists.
let ptrDown = false, pending = false;
addEventListener("pointerdown", () => { ptrDown = true; }, true);
const release = () => { ptrDown = false; if (pending) { pending = false; setTimeout(update, 0); } };
addEventListener("pointerup", release, true);
addEventListener("pointercancel", release, true);
addEventListener("resize", () => { if (UI.view === "coin") drawChart(S.coins[UI.id]); });

/* ---------- persistence + boot ---------- */
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function load() { try { const d = JSON.parse(localStorage.getItem(KEY)); return d && d.v === 1 && d.wallets && d.pw?.length ? d : null; } catch (e) { return null; } }
document.addEventListener("visibilitychange", () => { if (document.hidden && S) save(); });

let timer = null;
function start(data) {
  S = (data && data.state && data.state.v === 1) ? data.state : (load() || newGame());
  S.booting = false;
  S.hardened = S.hardened || {}; if (S.lastHack == null) S.lastHack = -99;
  derive();
  if (data && data.ui) Object.assign(UI, data.ui);
  render();
  clearInterval(timer);
  timer = setInterval(() => {
    sim();
    if (ptrDown) pending = true; else update();
    if (S.t % 5 === 0) save();
  }, 1000);
}
window.claude?.hot?.snapshot?.(() => ({ state: S, ui: UI }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
